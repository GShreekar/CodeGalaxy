  <!-- Wordmark -->
  <text x="48" y="25" fill="#ffffff" font-family="Space Grotesk, system-ui, sans-serif" font-weight="700" font-size="19" letter-spacing="-0.03em">Code<tspan fill="#00e5ff">Galaxy</tspan></text>
